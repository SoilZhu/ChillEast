name: Release Stable & Deploy CDN

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  build-and-deploy:
    name: Build Release APKs & Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure Android Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Android signing configuration generated."
          else
            echo "::warning::KEYSTORE_BASE64 secret not found. APK will be built without custom release signing."
          fi

      - name: Verify dependency manifests
        run: |
          test -f pubspec.yaml
          test -f pubspec.lock

      - name: Install locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Build Universal Release APK (Fat)
        run: |
          mkdir -p dist
          flutter build apk --release --no-pub \
            --dart-define=DEFAULT_AI_API_KEY="${{ secrets.DEFAULT_AI_API_KEY }}" \
            --dart-define=DEFAULT_AI_API_URL="${{ secrets.DEFAULT_AI_API_URL }}" \
            --dart-define=DEFAULT_AI_MODEL="${{ secrets.DEFAULT_AI_MODEL }}"
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-universal-release.apk
          echo "Successfully built true Universal APK (app-universal-release.apk)"

      - name: Build Split Release APKs
        run: |
          flutter build apk --release --no-pub --split-per-abi \
            --dart-define=DEFAULT_AI_API_KEY="${{ secrets.DEFAULT_AI_API_KEY }}" \
            --dart-define=DEFAULT_AI_API_URL="${{ secrets.DEFAULT_AI_API_URL }}" \
            --dart-define=DEFAULT_AI_MODEL="${{ secrets.DEFAULT_AI_MODEL }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/
          echo "Successfully built Split ABI APKs (arm64, armv7, x86_64)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-universal-release.apk
            dist/app-arm64-v8a-release.apk
            dist/app-armeabi-v7a-release.apk
            dist/app-x86_64-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          RELEASE_BODY=$(gh release view "$TAG_NAME" --json body -q .body 2>/dev/null || true)
          python3 -c '
          import json, os, re
          tag = os.environ.get("TAG_NAME", "")
          version = tag.lstrip("v")
          body = os.environ.get("RELEASE_BODY", "")
          # 支持在说明中指定强制更新标记（如 [force_update]、[force] 或 <!-- force_update -->）
          # 默认为 False
          force_update = bool(re.search(r"\[force(_update)?\]|<!--\s*force(_update)?\s*-->|force_update:\s*true", body, re.IGNORECASE))
          clean_body = re.sub(r"<!--\s*force(_update)?\s*-->|\[force(_update)?\]", "", body, flags=re.IGNORECASE).strip()
          data = {
              "version": version,
              "tag_name": tag,
              "force_update": force_update,
              "release_notes": clean_body,
              "body": clean_body,
              "download_url": "https://eastchill-apk.soilzhu.su/latest/app-release.apk"
          }
          with open("dist/version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          '
          cat dist/version.json

      # R2 是正式发布的必要目标；凭据缺失或上传失败时应让发布失败，不能静默跳过。
      # 上传至 R2 时，将体积更小的 arm64-v8a 命名为 app-release.apk，供 CDN 快速分发与应用内更新
      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws s3 cp dist/app-arm64-v8a-release.apk \
            s3://${R2_BUCKET_NAME}/latest/app-release.apk \
            --endpoint-url https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com \
            --cache-control "public, max-age=300, s-maxage=300"
          echo "Successfully uploaded app-arm64-v8a-release.apk as latest/app-release.apk to Cloudflare R2"

          aws s3 cp dist/version.json \
            s3://${R2_BUCKET_NAME}/latest/version.json \
            --endpoint-url https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com \
            --cache-control "public, max-age=60, s-maxage=180" \
            --content-type "application/json; charset=utf-8"
          echo "Successfully uploaded version.json to Cloudflare R2"

      # CDN 清缓存是可选步骤。使用前置步骤检查 Secrets，避免在步骤自己的 if 中
      # 判断尚未映射的 env，导致 Secrets 已配置却仍被静默跳过。
      - name: Check CDN purge configuration
        id: cdn_purge_config
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$CF_ZONE_ID" ] && [ -n "$CF_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_ZONE_ID or CF_API_TOKEN is not configured; skipping CDN cache purge."
          fi

      - name: Purge Cloudflare CDN Cache
        if: steps.cdn_purge_config.outputs.enabled == 'true'
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          PURGE_RES=$(curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://eastchill-apk.soilzhu.su/latest/app-release.apk","https://eastchill-apk.soilzhu.su/latest/version.json"]}')
          echo "Cloudflare Purge Cache Response: $PURGE_RES"
          python3 -c 'import json,sys; data=json.load(sys.stdin); sys.exit(0 if data.get("success") is True else 1)' <<< "$PURGE_RES"
